vad:
  speech_threshold: 0.5
  silence_duration_ms: 600
  min_speech_duration_ms: 200
  barge_in_enabled: true
  barge_in_min_speech_ms: 200

audio:
  output_device_index: null
  input_device_index: null
  echo_suppression: true
  echo_margin: 1.75

input_mode: "always_on"  # or "ptt"
tts:
  provider: "fish_audio"  # or "cartesia"/"fish_audio"
  # voice_id is only used when provider is "cartesia".
  # fish_audio_voice_id is REQUIRED when provider is "fish_audio" -- Fish
  # Audio does not use a consistent default voice when it's omitted (a
  # different voice gets used per call). Pick one via `python scripts/setup.py`
  # or from https://fish.audio/discovery.
  fish_audio_voice_id: "933563129e564b19a115bedd57b7406a"

stt:
  provider: "groq"  # or "groq"/"huggingface"
  model: "whisper-large-v3-turbo"

llm:
  provider: "groq"  # or "groq"/"huggingface"
  # Must support both tool calling and vision (capture_screen needs the
  # latter) -- check console.groq.com/docs/models and
  # console.groq.com/docs/vision before changing.
  model: "qwen/qwen3.6-27b"

storage:
  db_path: "./agent_turns.db"

mode: "mock"  # or "live"/"mock"
