vad:
  speech_threshold: 0.5
  silence_duration_ms: 600
  min_speech_duration_ms: 200

audio:
  output_device_index: null  # null = OS default

input_mode: "always_on"  # or "ptt"
tts:
  provider: "cartesia"  # or "deepgram"
  voice_id: "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"

stt:
  provider: "huggingface"  # or "groq" -- switch to "groq" once you have Groq credits
  model: "openai/whisper-large-v3-turbo"  # Hugging Face model id, or a Groq Whisper model id when provider is "groq"

llm:
  provider: "huggingface"  # or "groq" -- switch to "groq" once you have Groq credits
  # Tool-calling support on HF Inference varies by model/provider -- verify this
  # model actually emits tool_calls before trusting it in the live voice loop.
  model: "meta-llama/Llama-3.3-70B-Instruct"

storage:
  db_path: "./agent_turns.db"

mode: "live"  # or "mock"
